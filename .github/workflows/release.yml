name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # hanya akan dijalankan ketika ada push dengan tag seperti 'v1.0', 'v1.1', dll

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adoptopenjdk'

    - name: Build APK
      run: ./gradlew assembleRelease  # menjalankan gradle untuk membangun APK release

    - name: Upload APK to Releases
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/app-release.apk  # path ke APK yang dihasilkan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # token otomatis yang digunakan oleh GitHub Actions untuk mengakses API
